# OCI variant of targeting-service/db.yaml: storageClassName=oci-bv, 50Gi.
# Reuses targeting-db-credentials (secrets.yaml) and targeting-db-init (configmap.yaml).
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-db
  namespace: togglemaster
spec:
  clusterIP: None
  selector:
    app: targeting-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: targeting-db
  namespace: togglemaster
spec:
  serviceName: targeting-db
  replicas: 1
  selector:
    matchLabels:
      app: targeting-db
  template:
    metadata:
      labels:
        app: targeting-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: targeting-db-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "targeting_db", "-d", "targeting_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "targeting_db", "-d", "targeting_db"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: init
          configMap:
            name: targeting-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: oci-bv
        resources:
          requests:
            storage: 50Gi
